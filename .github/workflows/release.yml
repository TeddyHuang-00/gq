# Based on typst's release action:
# https://github.com/typst/typst/blob/main/.github/workflows/release.yml

name: Build Release Binaries
on:
  release:
    types: [published]

jobs:
  build-release:
    name: release ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Install Cross-Compilation Tools
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Run Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Setup python for checksums
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Create artifact directory
        shell: bash
        run: |
          directory=gq-${{ matrix.target }}
          build_dir=target/${{ matrix.target }}/release
          # build.rs may write to target/<profile> rather than target/<target>/<profile>.
          [ -d "$build_dir/completions" ] || build_dir=target/release

          mkdir "$directory"
          cp README.md LICENSE-MIT LICENSE-APACHE "$directory"
          [ ! -d docs ] || cp -r docs "$directory"
          cp -r "$build_dir/completions" "$directory"
          cp -r "$build_dir/man" "$directory"
          cp "$build_dir/gq" "$directory"

          tar cJf "$directory.tar.xz" "$directory"
          python3 -c "import hashlib; open('$directory.tar.xz.sha256', 'w').write(hashlib.file_digest(open('$directory.tar.xz', 'rb'), 'sha256').hexdigest())"

          # Keep the loose completions/manpage for separate upload.
          mkdir -p artifacts
          cp -r "$build_dir/completions" "$build_dir/man" artifacts/

      - name: Upload Release
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: "gq-${{ matrix.target }}.*"
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true

      - name: Upload Shell Completion
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: "artifacts/completions/*"
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true

      - name: Upload Manpage
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: "artifacts/man/*"
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
  update-changelog:
    name: Update Changelog
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Update CHANGELOG
        id: changelog
        uses: requarks/changelog-action@v1.10.3
        with:
          token: ${{ github.token }}
          tag: ${{ github.event.release.tag_name }}
          writeToFile: false

      - name: Update Release
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          body: ${{ steps.changelog.outputs.changes }}
