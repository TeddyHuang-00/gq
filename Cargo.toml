[package]
name = "gq"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "GPU job runner that selects idle cards and runs commands with CUDA_VISIBLE_DEVICES."
authors = ["Nan Huang <teddyhuangnan@gmail.com>"]
repository = "https://github.com/TeddyHuang-00/gq"

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
clap = { version = "4.6.7", features = ["cargo", "derive", "help"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
csv = "1.4"
itertools = "0.15.0"
log = "0.4.34"
ndarray = "0.17.2"
nom = "8.0.0"
rustix = { version = "1.1.5", features = ["process", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.5"
simple_logger = { version = "5.2.0", features = ["stderr"] }
tabled = { version = "0.22.0", features = ["ansi"] }
toml = "1.1.8"

[build-dependencies]
clap = { version = "4.6.7", features = ["cargo", "derive", "help"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
clap_mangen = "0.3.3"

[lints.clippy]
# Comprehensive lints for larger projects
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "allow", priority = -1 }

# Security-focused lints
unwrap_used = "deny"
expect_used = "deny"

# Allow some pedantic lints that are too strict for larger projects
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
